<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIBLE STUDY</title>
    
    <!-- CSS Dependencies (Updated to JSDelivr for reliability) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #d4af37; 
            --bg: #050506; 
            --panel: rgba(20, 20, 22, 0.95); 
            --border: 1px solid rgba(212, 175, 55, 0.3); 
            --glow: 0 0 15px rgba(212, 175, 55, 0.2);
            --font-main: 'Inter', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); 
            color: #e0e0e0; 
            font-family: var(--font-main); 
            margin: 0; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1d 0%, #050506 100%);
        }
        
        .navbar { 
            background: rgba(0, 0, 0, 0.9); 
            backdrop-filter: blur(15px);
            border-bottom: var(--border); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .logo { 
            color: var(--gold); 
            font-family: var(--font-tech);
            font-weight: 700; 
            letter-spacing: 3px; 
            font-size: clamp(0.9rem, 4vw, 1.4rem);
        }

        #auth-zone {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .admin-only {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .container { width: 95%; max-width: 1400px; margin: 0 auto; padding: 20px 0; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 25px; 
        }

        .card { 
            background: var(--panel); 
            border: var(--border); 
            padding: 15px; 
            cursor: pointer; 
            border-radius: 12px; 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            transform: translateY(-8px); 
            border-color: var(--gold);
            box-shadow: var(--glow);
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1 / 1.4;
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            border: 1px solid #222;
        }

        .card h4 {
            margin: 10px 0;
            font-family: var(--font-tech);
            font-size: 0.85rem;
            color: #fff;
            text-align: center;
        }

        .btn { 
            background: transparent; 
            border: 1px solid var(--gold); 
            color: var(--gold); 
            padding: 10px 15px; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 10px; 
            font-weight: 700; 
            font-family: var(--font-tech);
            letter-spacing: 1px;
            transition: 0.3s; 
            border-radius: 4px;
        }

        .btn:hover { background: var(--gold); color: #000; }

        .btn-danger {
            border-color: #ff4d4d !important;
            color: #ff4d4d !important;
        }
        .btn-danger:hover {
            background: #ff4d4d !important;
            color: #fff !important;
        }

        #admin-panel { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 2000; 
            align-items: center; 
            justify-content: center;
            padding: 15px;
        }

        .modal { 
            background: #111; 
            border: var(--border); 
            width: 100%; 
            max-width: 850px; 
            padding: 25px; 
            border-radius: 12px; 
            max-height: 90vh; 
            overflow-y: auto; 
        }

        input[type="text"] { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            background: #000; border: 1px solid #333; color: var(--gold); 
            border-radius: 4px;
            font-family: var(--font-main);
        }

        /* Editor Modal Layout */
        .editor-wrapper {
            margin-bottom: 15px;
        }

        .ql-toolbar.ql-snow {
            background: #1a1a1c;
            border-color: #333 !important;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }
        .ql-stroke { stroke: var(--gold) !important; }
        .ql-fill { fill: var(--gold) !important; }
        .ql-picker { color: var(--gold) !important; }

        #editor-container { 
            height: 350px; 
            background: #ffffff; 
            color: #111; 
            border-bottom-left-radius: 4px; 
            border-bottom-right-radius: 4px; 
            font-family: var(--font-main);
            font-size: 14px;
            line-height: 1.6;
        }

        .page-break { 
            display: block; 
            border: 2px dashed var(--gold); 
            text-align: center; 
            padding: 10px; 
            margin: 20px 0; 
            background: #fff9e6; 
            color: var(--gold); 
            font-weight: bold; 
            font-family: var(--font-tech);
        }

        /* Reader Overlay */
        #viewer { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 5000; 
            overflow: hidden;
        }

        .viewer-nav { 
            height: 60px;
            padding: 0 20px; 
            background: #000; 
            border-bottom: 1px solid #222; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative;
            z-index: 1001;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        #book-viewport { 
            position: relative;
            width: 100vw;
            height: calc(100vh - 60px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #080808;
            cursor: pointer;
        }
        
        #flipbook { 
            position: relative;
            width: 700px;
            height: 85vh;
            max-width: 95vw;
            perspective: 2000px;
        }

        .page { 
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff; 
            color: #111; 
            overflow: hidden; 
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            user-select: none;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        .page-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .cover-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center;
            color: var(--gold);
            font-family: var(--font-tech);
            font-size: 11px;
            letter-spacing: 2px;
        }

        .page-content { 
            padding: 40px; 
            flex: 1;
            overflow-y: auto; 
            box-sizing: border-box; 
            font-family: var(--font-main);
            line-height: 1.7;
            font-size: 16px;
        }

        .page-footer {
            padding: 10px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            font-family: var(--font-tech);
            background: #fafafa;
        }

        .nav-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            font-family: var(--font-tech);
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1000;
        }

        .page.hard { 
            background: #0e0e0e !important; 
            color: var(--gold) !important; 
            border: 8px double var(--gold); 
            display: none;
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .navbar { padding: 0.8rem 15px; }
            .logo { font-size: 0.8rem; }
            .modal { padding: 15px; }
            .page-content { padding: 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">BIBLE STUDY</div>
    <div id="auth-zone">
        <button class="btn" id="login-btn" onclick="handleAuth()">Access</button>
        <div class="admin-only" style="display:none;">
            <button class="btn" onclick="openCreator()">+ NEW</button>
            <button class="btn btn-danger" onclick="logout()">EXIT</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="gallery" class="grid"></div>
</div>

<div id="admin-panel">
    <div class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color:var(--gold); font-family:var(--font-tech); margin:0;" id="admin-modal-title">ARCHIVE COMPILER</h3>
            <button class="btn btn-danger" onclick="closeAdmin()">EXIT</button>
        </div>
        
        <input type="hidden" id="edit-id">
        <input type="text" id="theme" placeholder="DOCUMENT TITLE">
        
        <div style="background:#000; padding:12px; border:1px solid #333; margin-bottom:12px; border-radius:4px;">
            <label style="color:var(--gold); font-size:9px; font-family:var(--font-tech);">COVER IMAGE (PORTRAIT)</label><br>
            <input type="file" id="cover-upload" accept="image/*" style="margin-top:8px; font-size:11px;">
        </div>
        
        <div class="editor-wrapper">
            <div id="editor-container"></div>
        </div>
        
        <input type="text" id="reference" placeholder="REFERENCE URL" style="margin-top:12px;">
        
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:15px;">
            <button class="btn" id="save-btn" onclick="processAndSave()">PUBLISH</button>
            <button class="btn btn-danger" onclick="closeAdmin()">CANCEL</button>
        </div>
    </div>
</div>

<div id="viewer">
    <div class="viewer-nav">
        <span style="color:var(--gold); font-family:var(--font-tech); font-size:11px; letter-spacing:1px;">RECORD_VIEWER</span>
        <div class="viewer-actions">
            <button class="btn" onclick="generatePDF(event)">EXPORT</button>
            <button class="btn btn-danger" onclick="closeViewer(event)">EXIT</button>
        </div>
    </div>
    <div id="book-viewport" onclick="nextPageLoop()">
        <div id="flipbook"></div>
        <div class="nav-hint">TAP ANYWHERE TO READ</div>
    </div>
</div>

<!-- Synchronous JS Dependencies with CDN fallbacks -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>

<!-- Global Script execution before Module -->
<script>
    window.quillInstance = null;

    function registerQuillPageBreak() {
        if (typeof Quill !== "undefined" && !window.pageBreakRegistered) {
            try {
                var BlockEmbed = Quill.import('blots/block/embed');
                class PageBreak extends BlockEmbed {
                    static create() {
                        let node = super.create();
                        node.setAttribute('class', 'page-break');
                        node.innerHTML = "--- PAGE BREAK ---";
                        return node;
                    }
                }
                PageBreak.blotName = 'pagebreak';
                PageBreak.tagName = 'div';
                Quill.register(PageBreak, true);
                window.pageBreakRegistered = true;
            } catch(e) {
                console.warn("Blot registration skipped or already exists", e);
            }
        }
    }

    function initQuillEditor() {
        if (typeof Quill === "undefined") {
            alert("Quill script blocked or taking time to load. Check internet connection.");
            return false;
        }

        registerQuillPageBreak();

        // Reset target container DOM
        $(".editor-wrapper").html('<div id="editor-container"></div>');

        window.quillInstance = new Quill('#editor-container', { 
            theme: 'snow', 
            modules: { 
                toolbar: {
                    container: [
                        [{ 'header': [1, 2, false] }],
                        ['bold', 'italic', 'underline'], 
                        ['image'], 
                        [{ 'list': 'bullet' }], 
                        ['pagebreak'], 
                        ['clean']
                    ],
                    handlers: { 
                        'pagebreak': function() {
                            const range = this.quill.getSelection();
                            if (range) { 
                                this.quill.insertEmbed(range.index, 'pagebreak', true); 
                                this.quill.setSelection(range.index + 1); 
                            }
                        }
                    }
                }
            }
        });
        $('.ql-pagebreak').html('<b>PAGE</b>');
        return true;
    }
</script>

<!-- Firebase Application Module -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKxdIxwLrAuQ1DnlrP57KXz39VYBbn2Ns",
        authDomain: "word-5592c.firebaseapp.com",
        projectId: "word-5592c",
        storageBucket: "word-5592c.firebasestorage.app",
        messagingSenderId: "352185501602",
        appId: "1:352185501602:web:1372f15784d0ade32994fb",
        measurementId: "G-0QNMZ6G4ZN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentPage = 0;
    let totalPages = 0;
    
    window.bookletStore = {};

    window.handleAuth = async () => {
        const e = prompt("ID:"), p = prompt("CODE:");
        if(e && p) {
            try { 
                await signInWithEmailAndPassword(auth, e, p); 
            } catch(err) { 
                alert("Access Denied: " + err.message); 
            }
        }
    };

    window.logout = () => signOut(auth).then(() => location.reload());

    window.openCreator = () => {
        $("#admin-modal-title").text("ARCHIVE COMPILER");
        $("#save-btn").text("PUBLISH");
        $("#edit-id").val(""); 
        $("#theme, #reference, #cover-upload").val("");
        window.tempCover = "";
        
        // Modal displayed prior to initializing Quill so CSS measurements are calculated properly
        $("#admin-panel").css('display', 'flex').hide().fadeIn(200, () => {
            if (initQuillEditor() && window.quillInstance) {
                window.quillInstance.setText('');
            }
        });
    };

    window.editEntry = (id, event) => {
        if(event) event.stopPropagation();
        const data = window.bookletStore[id];
        if(!data) return alert("Record unavailable for editing.");

        $("#admin-modal-title").text("EDIT ARCHIVE RECORD");
        $("#save-btn").text("UPDATE");
        $("#edit-id").val(id); 
        $("#theme").val(data.theme || ""); 
        $("#reference").val(data.reference || "");
        window.tempCover = data.cover || "";

        $("#admin-panel").css('display', 'flex').hide().fadeIn(200, () => {
            if (initQuillEditor() && window.quillInstance) {
                window.quillInstance.clipboard.dangerouslyPasteHTML(data.content || "");
            }
        });
    };

    window.closeAdmin = () => {
        $("#admin-panel").fadeOut();
        $("#edit-id").val("");
        if (window.quillInstance) window.quillInstance.setText('');
    };

    window.processAndSave = async () => {
        const id = $("#edit-id").val();
        const theme = $("#theme").val();
        const content = window.quillInstance ? window.quillInstance.root.innerHTML : "";
        const file = $("#cover-upload")[0].files[0];

        if(!theme) return alert("Title required");
        
        $("#save-btn").text("SYNCING...").prop("disabled", true);
        try {
            let coverData = window.tempCover || "";
            if(file) {
                coverData = await new Promise(res => {
                    const reader = new FileReader(); 
                    reader.readAsDataURL(file);
                    reader.onload = e => {
                        const img = new Image(); 
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 600; 
                            canvas.height = 850;
                            canvas.getContext('2d').drawImage(img, 0, 0, 600, 850);
                            res(canvas.toDataURL('image/jpeg', 0.85));
                        };
                    };
                });
            }

            const data = { 
                theme, 
                content, 
                cover: coverData, 
                reference: $("#reference").val(), 
                updated: Date.now() 
            };

            if(id) {
                await updateDoc(doc(db, "booklets", id), data);
            } else {
                await addDoc(collection(db, "booklets"), data);
            }
            
            location.reload();
        } catch(e) { 
            alert("Save error: " + e.message); 
            $("#save-btn").text(id ? "UPDATE" : "PUBLISH").prop("disabled", false); 
        }
    };

    window.openReader = (id) => {
        const data = window.bookletStore[id];
        if (!data) return alert("Record not found.");

        $("#viewer").fadeIn(200);
        const fb = $("#flipbook").empty();

        if (data.cover && data.cover.trim().length > 0) {
            fb.append(`
                <div class="page active">
                    <img src="${data.cover}" class="page-cover" alt="Booklet Cover">
                    <div class="cover-overlay">TAP TO START READING</div>
                </div>
            `);
        } else {
            fb.append(`
                <div class="page hard active">
                    <div style="padding:30px; text-align:center;">
                        <h2 style="font-size:1.6rem; font-family:'Orbitron'; color:var(--gold);">${data.theme || 'Untitled'}</h2>
                        <p style="font-size:10px; margin-top:30px; color:#aaa; font-family:'Orbitron';">TAP TO BEGIN PAGE 1</p>
                    </div>
                </div>
            `);
        }

        const contentHtml = data.content || "";
        let pages = [];

        if (contentHtml.includes('class="page-break"')) {
            pages = contentHtml.split(/<div class="page-break"[^>]*>.*?<\/div>/gi);
        } else {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = contentHtml;
            const children = Array.from(tempDiv.children);
            
            let currentPageHTML = "";
            let blockCount = 0;

            children.forEach((child) => {
                currentPageHTML += child.outerHTML;
                blockCount++;
                if (blockCount >= 3) {
                    pages.push(currentPageHTML);
                    currentPageHTML = "";
                    blockCount = 0;
                }
            });

            if (currentPageHTML.trim().length > 0) pages.push(currentPageHTML);
        }

        pages = pages.filter(p => p.trim().length > 0);
        if (pages.length === 0) pages = ["<p>No content available.</p>"];

        pages.forEach((pageContent, i) => {
            fb.append(`
                <div class="page">
                    <div class="page-content ql-editor">
                        ${pageContent}
                    </div>
                    <div class="page-footer">
                        <span>${data.theme || 'Archive'}</span>
                        <span>PAGE ${i + 1} OF ${pages.length}</span>
                    </div>
                </div>
            `);
        });

        const totalWords = contentHtml.replace(/<[^>]*>/g, '').trim().split(/\s+/).filter(Boolean).length;

        fb.append(`
            <div class="page hard">
                <div style="padding: 30px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
                    <h3 style="font-family: var(--font-tech); color: var(--gold); margin-bottom: 10px; font-size: 1.2rem;">
                        END OF RECORD
                    </h3>
                    <div style="width: 50px; height: 2px; background: var(--gold); margin: 15px auto; opacity: 0.6;"></div>
                    <p style="font-size: 0.85rem; color: #fff; margin: 8px 0;"><strong>${data.theme || 'Untitled'}</strong></p>
                    <div style="font-size: 11px; color: #aaa; margin-top: 15px; line-height: 1.8;">
                        <div>Total Pages: <span style="color: var(--gold);">${pages.length}</span></div>
                        <div>Total Words: <span style="color: var(--gold);">${totalWords}</span></div>
                    </div>
                    <p style="font-size:10px; margin-top:30px; color:var(--gold); font-family:'Orbitron';">TAP TO RETURN TO COVER</p>
                </div>
            </div>
        `);

        currentPage = 0;
        totalPages = $("#flipbook .page").length;
        updatePageVisibility();
    };

    window.nextPageLoop = () => {
        currentPage = (currentPage + 1) % totalPages;
        updatePageVisibility();
    };

    function updatePageVisibility() {
        const pages = $("#flipbook .page");
        pages.removeClass("active");
        $(pages[currentPage]).addClass("active");
    }

    window.deleteEntry = async (id, event) => {
        if(event) event.stopPropagation();
        if(confirm("Confirm deletion?")) { 
            await deleteDoc(doc(db, "booklets", id)); 
            location.reload(); 
        }
    };

    window.closeViewer = (e) => { 
        if(e) e.stopPropagation();
        $("#viewer").fadeOut(200); 
        $("#flipbook").empty(); 
    };

    window.generatePDF = async (e) => {
        if(e) e.stopPropagation();
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'pt', 'a4');
        const pgs = document.querySelectorAll('.page');
        for (let i = 0; i < pgs.length; i++) {
            pgs[i].style.display = 'block';
            const canvas = await html2canvas(pgs[i], { scale: 2, useCORS: true, allowTaint: true });
            pgs[i].style.display = '';
            if (i > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 595, 842);
        }
        updatePageVisibility();
        pdf.save("Record_Export.pdf");
    };

    onAuthStateChanged(auth, (user) => {
        if(user) { $(".admin-only").css('display','flex'); $("#login-btn").hide(); }
        fetchData();
    });

    const fetchData = async () => {
        try {
            const snap = await getDocs(query(collection(db, "booklets"), orderBy("updated", "desc")));
            const gal = $("#gallery").empty();
            window.bookletStore = {};
            
            snap.forEach(d => {
                const data = d.data();
                window.bookletStore[d.id] = data;

                gal.append(`
                    <div class="card" onclick="openReader('${d.id}')">
                        <img src="${data.cover || 'https://via.placeholder.com/250x350?text=No+Cover'}">
                        <h4>${data.theme || 'Untitled'}</h4>
                        <div class="admin-only" style="display:${auth.currentUser?'flex':'none'}; justify-content:center; gap:8px; margin-top:10px;">
                            <button class="btn" style="padding:5px 10px; flex:1;" onclick="editEntry('${d.id}', event)">EDIT</button>
                            <button class="btn btn-danger" style="padding:5px 10px; flex:1;" onclick="deleteEntry('${d.id}', event)">DEL</button>
                        </div>
                    </div>
                `);
            });
        } catch(err) {
            console.error("Firestore Error:", err);
        }
    };
</script>
</body>
</html>
